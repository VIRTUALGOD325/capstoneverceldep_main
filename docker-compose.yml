version: '3.8'

services:
  docinsight-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - DOCINSIGHT_USE_FINE_TUNED=true
      - DOCINSIGHT_EXTENDED_CORPUS=true
    volumes:
      # Mount model directories if they exist
      - ./models:/app/models:ro
      - ./checkpoints:/app/checkpoints:ro
      - ./embeddings:/app/embeddings:ro
      - ./index:/app/index:ro
      - ./indexes:/app/indexes:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Allow time for models to load

  docinsight-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://docinsight-backend:8000
    depends_on:
      docinsight-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3